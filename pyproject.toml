[project]
name = "yt-learn"
version = "0.0.1"
description = "YouTube learning assistant: summarize playlists, generate quizzes and flashcards, export notes to Markdown and Anki."
readme = "README.md"
license = "MIT"
authors = [{ name = "Junaid Jameel" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.11.23",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_learn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
